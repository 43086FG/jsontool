[package]
name = "jsontool"
version = "1.0.0"
description = "jsontool - minimal JSON graph editor"
authors = ["43086FG"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["dialog-all", "fs-all", "window-all"] }
# Pinned to the last releases that build with Rust 1.77.2, which is required to
# keep the shipped binary compatible with Windows 7 SP1 (see rust-toolchain.toml).
serde = { version = "=1.0.205", features = ["derive"] }
serde_json = "=1.0.132"
uuid = { version = "1", features = ["v4"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
# Full LTO + codegen-units=1 needs more memory than some build machines have,
# so keep the release build reproducible on modest hardware.
codegen-units = 8
lto = "thin"
opt-level = "s"
strip = true

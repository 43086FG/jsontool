[package]
name = "jsontool"
version = "1.0.1"
description = "jsontool - minimal JSON graph editor"
authors = ["43086FG"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[features]
# this feature is used for production builds or when `devUrl` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
# Full LTO + codegen-units=1 needs more memory than some build machines have,
# so keep the release build reproducible on modest hardware.
codegen-units = 8
lto = "thin"
opt-level = "s"
strip = true
